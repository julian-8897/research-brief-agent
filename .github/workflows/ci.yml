name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Supported runtime matrix; keep in sync with requires-python in
        # pyproject.toml (>=3.11,<3.14) and the Docker base image.
        python-version: ["3.11", "3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Offline core evaluation quality gate
        run: >-
          uv run python evals/run_eval.py
          --offline-fixture
          --core
          --quality-gate
          --jsonl /tmp/research-brief-core-eval.jsonl
          --markdown /tmp/research-brief-core-eval.md
